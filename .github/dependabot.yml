# Propositions automatiques de mise à jour, chaque lundi (une demande de fusion par famille).
# Chaque proposition est testée par la CI avant que vous ne l'acceptiez.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
