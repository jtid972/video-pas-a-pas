[project]
name = "video-pas-a-pas"
version = "1.0.0"
description = "Vidéo pas à pas : prépare une vidéo ou un audio (transcription + captures) pour une IA"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["B008", "E501"]  # E501 : textes longs ; B008 : File(...) / Form(...) en valeur par défaut : idiome FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
